# Halsa login theme for ARL/IPS staff (plan Appendix A).
#
# Every kc*Class key of Keycloak 26.4 (theme/keycloak/login/theme.properties plus the keys the base
# templates read) is mapped here, to our own .hl-* component classes (keycloak-theme/src/halsa.css)
# or to nothing. That way the pages we don't override still render in the Halsa style. A missing
# key would fall back to nothing too, but listing them all keeps that decision explicit.
parent=base
import=common/keycloak

# No PatternFly: stylesCommon stays empty on purpose.
stylesCommon=
styles=css/halsa.css
scripts=js/halsa.js
locales=es
# The base template splits `meta` on spaces, so no value here may contain one.
meta=viewport==width=device-width,initial-scale=1

# Halsa-specific properties, read by template.ftl.
halsaVariant=personal
# Placeholder until the product owner publishes the data-treatment policy page.
halsaPrivacyUrl=https://halsa.alcast.dev/tratamiento-de-datos

## Page shell (template.ftl replaces most of the base layout)
kcHtmlClass=hl-html
kcBodyClass=hl-body
kcLoginClass=hl-login
kcLogoLink=
kcLogoClass=hl-logo
kcContainerClass=
kcContentClass=
kcContentWrapperClass=hl-stack
kcHeaderClass=hl-header
kcHeaderWrapperClass=hl-header-inner
kcFeedbackAreaClass=
kcFormAreaClass=
kcFormCardClass=hl-card
kcFormHeaderClass=hl-card-header
kcInfoAreaClass=hl-info
kcInfoAreaWrapperClass=hl-info-inner
kcSignUpClass=hl-signup
kcMarginTopClass=mt-4

## Locale (single locale: the switcher is never rendered, see template.ftl)
kcLocaleClass=hidden
kcLocaleMainClass=hidden
kcLocaleWrapperClass=hidden
kcLocaleDropDownClass=hidden
kcLocaleListClass=hidden
kcLocaleListItemClass=hidden
kcLocaleItemClass=hidden

## Alert
kcAlertClass=hl-alert
kcAlertTitleClass=hl-alert-text

