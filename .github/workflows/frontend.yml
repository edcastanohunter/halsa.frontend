name: Frontend CI

# Plan §11 gates: lint + unit + production build with the gzip budgets. E2E is excluded (it
# needs Keycloak and the backend). The images are built, not pushed, so a broken Dockerfile or
# nginx template fails the PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile is written by the npm in package.json "packageManager"; npm 10 rejects it.
      - name: Install dependencies
        run: npm install -g npm@11.6.2 && npm ci --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # Both apps + scripts/check-bundles.mjs (gzip budgets, no mock code in production).
      - name: Build
        run: npm run build

  images:
    name: Container image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    strategy:
      matrix:
        app: [backoffice, portal]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: halsa-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # The container must start with env-provided config and send the CSP (plan §10.2, §10.3).
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 \
            -e HALSA_KEYCLOAK_AUTHORITY=https://auth.example.com/realms/halsa \
            -e HALSA_API_BASE_URL=https://api.example.com \
            halsa-${{ matrix.app }}:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/config.json
          curl -fsSI http://localhost:8080/casos | grep -i "content-security-policy:.*require-trusted-types-for 'script'"
          curl -fsS http://localhost:8080/casos | grep -q '<app-root>'
          docker logs app

  # Push to main only: publish to GHCR and restart the quadlet units on the VPS.
  deploy:
    name: Publish & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backoffice
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backoffice/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/halsa-backoffice:latest
            ${{ env.REGISTRY }}/halsa-backoffice:${{ github.sha }}
          cache-from: type=gha,scope=backoffice

      - name: Push portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/portal/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/halsa-portal:latest
            ${{ env.REGISTRY }}/halsa-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The short-lived GITHUB_TOKEN is piped to podman login, so no PAT is stored on the VPS.
      - name: Pull and restart on the VPS
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="set -e
          podman login ghcr.io -u '$GH_USER' --password-stdin
          podman pull $REGISTRY/halsa-backoffice:latest
          podman pull $REGISTRY/halsa-portal:latest
          podman logout ghcr.io
          systemctl --user restart halsa-backoffice.service halsa-portal.service
          sleep 5
          podman ps --filter name=halsa- --format '{{.Names}} {{.Status}}'"
          printf '%s' "$GH_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$PORT" "$TARGET" "$remote"
