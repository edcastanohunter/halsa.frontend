name: Frontend CI

# Plan §11 gates: lint + unit + production build with the gzip budgets. E2E is excluded (it
# needs Keycloak and the backend). The images are built, not pushed, so a broken Dockerfile or
# nginx template fails the PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile is written by the npm in package.json "packageManager"; npm 10 rejects it.
      - name: Install dependencies
        run: npm install -g npm@11.6.2 && npm ci --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # Both apps + scripts/check-bundles.mjs (gzip budgets, no mock code in production).
      - name: Build
        run: npm run build

  images:
    name: Container image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    strategy:
      matrix:
        app: [backoffice, portal]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: halsa-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # The container must start with env-provided config and send the CSP (plan §10.2, §10.3).
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 \
            -e HALSA_KEYCLOAK_AUTHORITY=https://auth.example.com/realms/halsa \
            -e HALSA_API_BASE_URL=https://api.example.com \
            halsa-${{ matrix.app }}:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/config.json
          curl -fsSI http://localhost:8080/casos | grep -i "content-security-policy:.*require-trusted-types-for 'script'"
          curl -fsS http://localhost:8080/casos | grep -q '<app-root>'
          docker logs app

  # Push to main, after an approval in the "produccion" environment. Same model as Halsa.Backend: the images
  # are built here (the VPS is arm64) and travel inside the SSH session, there is no registry:
  #   ssh halsa-deploy@VPS "desplegar v1.0.<run_number>" < paquete.tar
  # The key can only run deploy/vps/recibir-despliegue-front.sh (docs/RUNBOOK.md §4.4).
  # Secrets of the "produccion" environment: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_SSH_KNOWN_HOSTS.
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: produccion
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    env:
      VERSION: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # The Angular build runs natively on the runner ($BUILDPLATFORM); QEMU only runs the nginx stage.
      - name: Image halsa-backoffice
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backoffice/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: localhost/halsa-backoffice:${{ env.VERSION }}
          cache-from: type=gha,scope=backoffice
          cache-to: type=gha,mode=max,scope=backoffice

      - name: Image halsa-portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/portal/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: localhost/halsa-portal:${{ env.VERSION }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal

      # paquete.tar: manifiesto.sha256 and imagenes.tar.gz.
      - name: Package
        run: |
          mkdir paquete
          docker save "localhost/halsa-backoffice:$VERSION" "localhost/halsa-portal:$VERSION" | gzip > paquete/imagenes.tar.gz
          (cd paquete && sha256sum imagenes.tar.gz > manifiesto.sha256)
          tar -cf paquete.tar -C paquete manifiesto.sha256 imagenes.tar.gz
          ls -lh paquete.tar

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Send and deploy
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: ssh -i ~/.ssh/id_deploy "$TARGET" "desplegar $VERSION" < paquete.tar
